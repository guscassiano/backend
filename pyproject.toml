[project]
name = "backend-movie-api"
version = "0.1.0"
description = "API CRUD to managing movies"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.120.2",

    "sqlalchemy>=2.0.44",
    "uvicorn>=0.38.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.3.0",
    "black>=24.4.2",
    "flake8>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
